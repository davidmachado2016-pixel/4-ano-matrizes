<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa em código — vegetação do Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FAFAF6;
  --tinta:#24312B;
  --tinta-fraca:#6B7A72;
  --linha:#C9D2C9;
  --painel:#FFFFFF;
  --borda:#E2E7E1;
  --acento:#1F5C3E;
  --fonte:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--fonte);
  font-size:16px;
  line-height:1.5;
  padding:24px;
}
h1{font-size:26px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
h1 + p{margin:0 0 24px;color:var(--tinta-fraca);max-width:60ch}
h2{font-size:15px;font-weight:700;margin:0 0 10px}

.tela{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;max-width:1180px;margin:0 auto}
@media(max-width:900px){.tela{grid-template-columns:1fr}}

.mapa{background:var(--painel);border:1px solid var(--borda);border-radius:14px;padding:18px}
svg{width:100%;height:auto;display:block;touch-action:none}
.cel{stroke:var(--linha);stroke-width:.25;cursor:crosshair}
.cel:hover{stroke:var(--acento);stroke-width:.6}
.num{font-family:var(--fonte);font-size:3.1px;fill:var(--tinta-fraca)}
.contorno{fill:none;stroke:#4A5A51;stroke-width:.55;stroke-linejoin:round;pointer-events:none}
.miolo{fill:#EDF1EC;pointer-events:none}

.modos{display:inline-flex;gap:4px;margin-top:18px;background:#EFF2EE;border-radius:11px;padding:4px}
.modo{font:inherit;font-weight:700;font-size:14px;border:0;background:none;color:var(--tinta-fraca);border-radius:8px;padding:7px 16px;cursor:pointer}
.modo[aria-pressed="true"]{background:var(--painel);color:var(--acento);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modo:focus-visible{outline:3px solid #A8CDB6;outline-offset:2px}
.fita{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lapis{
  display:flex;align-items:center;gap:9px;
  border:2px solid var(--borda);background:var(--painel);
  border-radius:11px;padding:9px 14px 9px 10px;
  font:inherit;font-weight:600;color:var(--tinta);cursor:pointer;
}
.lapis:hover{border-color:#B9C4BB}
.lapis[aria-pressed="true"]{border-color:var(--acento);background:#F1F6F2}
.lapis:focus-visible{outline:3px solid #A8CDB6;outline-offset:2px}
.pastilha{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.15);flex:none}
.codigo-num{color:var(--tinta-fraca);font-weight:400}

.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.btn{font:inherit;font-weight:600;border:1px solid var(--borda);background:var(--painel);color:var(--tinta);border-radius:9px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:#B9C4BB}
.btn:focus-visible{outline:3px solid #A8CDB6;outline-offset:2px}
.campo{font:inherit;border:1px solid var(--borda);border-radius:9px;padding:7px 10px;background:var(--painel);color:var(--tinta)}
.marca{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--tinta-fraca);cursor:pointer;user-select:none}

.painel{background:var(--painel);border:1px solid var(--borda);border-radius:14px;padding:18px;position:sticky;top:24px}
.abas{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--borda)}
.aba{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--tinta-fraca);padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.aba[aria-selected="true"]{color:var(--acento);border-bottom-color:var(--acento)}
.aba:focus-visible{outline:3px solid #A8CDB6;outline-offset:-2px}
.dica{font-size:13px;color:var(--tinta-fraca);margin:0 0 12px;min-height:34px}
.saida{
  background:#F6F8F5;border:1px solid var(--borda);border-radius:9px;
  padding:12px;font-size:13.5px;line-height:1.8;
  max-height:330px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0;
}
.saida:empty::after{content:"Pinte alguns quadradinhos e o código aparece aqui.";color:var(--tinta-fraca)}
.conta{font-size:13px;color:var(--tinta-fraca);margin:12px 0 0}

@media print{
  body{padding:0;background:#fff}
  h1,h1+p,.painel,.fita,.acoes{display:none}
  .tela{display:block}
  .mapa{border:0;padding:0}
}
</style>
</head>
<body>

<h1>Mapa em código</h1>
<p>Pinte os biomas ou as regiões do Brasil nos quadradinhos e veja o mapa virar instruções que uma máquina consegue guardar.</p>

<div class="tela">

  <div>
    <div class="mapa">

25 L61.93 104.59 L60.35 106.0 Z"/>
        <g id="celulas"></g>
        <g id="numeros"></g>
        <path class="contorno" id="linhaBrasil" d="M60.35 106.0 L59.69 104.61 L60.74 103.44 L59.36 101.76 L55.04 98.83 L54.15 98.9 L51.76 97.0 L50.21 97.26 L56.08 91.52 L59.69 89.16 L59.74 87.19 L58.55 85.77 L57.36 86.24 L58.16 82.01 L57.3 81.57 L55.51 81.86 L54.57 77.92 L52.96 77.25 L51.98 77.74 L49.47 77.26 L49.62 73.92 L48.92 72.55 L49.66 72.05 L49.43 70.64 L50.51 67.63 L49.95 66.1 L48.65 65.41 L48.39 64.44 L48.74 63.01 L44.17 62.91 L43.25 60.05 L43.95 60.01 L43.35 56.8 L41.96 56.07 L40.46 56.1 L37.86 54.9 L36.92 53.98 L34.25 53.57 L31.66 51.37 L31.81 46.93 L28.69 47.34 L25.35 49.26 L24.82 50.01 L19.39 50.0 L19.55 46.26 L17.59 47.71 L15.49 47.64 L14.58 46.33 L13.0 46.19 L13.51 45.13 L12.18 43.64 L11.19 41.42 L11.82 40.97 L11.81 39.93 L13.26 39.22 L13.02 37.89 L13.8 35.88 L18.8 33.37 L20.95 33.48 L22.08 25.67 L21.71 24.26 L20.65 23.36 L20.66 21.57 L22.48 21.42 L22.56 20.48 L21.16 20.23 L21.13 18.69 L25.78 18.74 L26.57 17.89 L27.7 20.12 L28.15 19.82 L29.46 21.12 L31.31 20.96 L31.78 20.21 L34.53 19.23 L34.81 18.19 L36.51 17.49 L36.38 16.97 L34.36 16.76 L34.13 13.56 L33.06 12.92 L33.51 12.7 L37.17 13.63 L37.86 13.05 L42.24 11.74 L43.11 10.8 L42.8 10.11 L44.04 10.0 L44.59 10.57 L44.28 11.65 L45.1 12.02 L45.65 13.16 L44.99 14.03 L44.61 16.13 L45.39 18.51 L46.86 19.66 L48.03 19.78 L50.9 18.11 L54.1 18.43 L54.15 16.73 L56.24 16.69 L58.65 17.72 L59.38 17.06 L60.24 17.85 L61.38 17.68 L62.3 16.74 L64.44 12.68 L65.25 12.56 L67.18 18.23 L68.46 18.63 L68.52 20.33 L66.73 22.36 L67.47 23.1 L71.68 23.48 L71.77 25.95 L73.58 24.34 L80.54 26.72 L81.71 28.17 L81.32 29.53 L84.09 28.77 L88.73 30.07 L92.29 29.98 L95.82 32.01 L98.87 34.77 L100.7 35.48 L102.74 35.58 L103.61 36.35 L104.81 40.97 L103.86 45.04 L99.29 50.07 L96.0 54.99 L95.41 55.04 L94.74 56.85 L94.91 61.46 L93.99 66.87 L93.24 67.84 L92.81 71.13 L90.4 74.35 L89.99 76.89 L88.06 77.95 L87.5 79.43 L84.91 79.42 L81.16 80.37 L79.48 81.46 L76.81 82.18 L74.0 84.14 L71.98 86.58 L71.64 88.42 L72.03 89.78 L71.05 93.46 L69.38 94.82 L66.73 99.15 L63.01 102.25 L61.93 104.59 L60.35 106.0 Z"/>
      </svg>
    </div>

    <div class="modos" role="group" aria-label="O que pintar">
      <button class="modo" data-modo="biomas" aria-pressed="true">Biomas</button>
      <button class="modo" data-modo="regioes" aria-pressed="false">Regiões do Brasil</button>
    </div>

    <div class="fita" id="fita"></div>

    <div class="acoes">
      <label class="marca" for="tamanho">Tamanho da grade</label>
      <select class="campo" id="tamanho">
        <option value="10">10 por 10</option>
        <option value="12" selected>12 por 12</option>
        <option value="16">16 por 16</option>
      </select>
      <label class="marca"><input type="checkbox" id="soCamada"> Ver só o que está selecionado</label>
      <button class="btn" id="limpar">Limpar tudo</button>
      <button class="btn" id="imprimir">Imprimir a grade</button>
    </div>
  </div>

  <div class="painel">
    <h2 id="tituloPainel">Código: Amazônia</h2>
    <div class="abas" role="tablist">
      <button class="aba" role="tab" aria-selected="true" data-nivel="coord">Coordenadas</button>
      <button class="aba" role="tab" aria-selected="false" data-nivel="linha">Linha a linha</button>
      <button class="aba" role="tab" aria-selected="false" data-nivel="conta">Contagem</button>
    </div>
    <p class="dica" id="dica"></p>
    <pre class="saida" id="saida"></pre>
    <p class="conta" id="conta"></p>
    <div class="acoes">
      <button class="btn" id="copiar">Copiar código</button>
    </div>
  </div>

</div>

<script>
const VEG = [
  {cod:1, nome:"Amazônia",       cor:"#2F7A45"},
  {cod:2, nome:"Mata Atlântica", cor:"#86B44A"},
  {cod:3, nome:"Cerrado",        cor:"#E5B33F"},
  {cod:4, nome:"Caatinga",       cor:"#D07C3E"},
  {cod:5, nome:"Pantanal",       cor:"#4E9CAA"},
  {cod:6, nome:"Pampa",          cor:"#B9CB74"}
];
const REG = [
  {cod:1, nome:"Norte",        cor:"#4B8F5C"},
  {cod:2, nome:"Nordeste",     cor:"#E08A3C"},
  {cod:3, nome:"Centro-Oeste", cor:"#D96A8B"},
  {cod:4, nome:"Sudeste",      cor:"#4A7FB5"},
  {cod:5, nome:"Sul",          cor:"#8A6BB0"}
];
const CONJ = {biomas:VEG, regioes:REG};
const DICAS = {
  coord:"Cada quadradinho é achado pela linha e pela coluna, como no jogo de batalha naval.",
  linha:"Lê-se a linha inteira de ponta a ponta: 1 é pintado, 0 é vazio.",
  conta:"Em vez de repetir o mesmo número, conta-se quantos vêm seguidos. Isso é a repetição."
};

const X0=10, Y0=10, LADO=96;
let N=12, modo="biomas", dados={biomas:{},regioes:{}};
let lapis=1, foco=1, nivel="coord", pintando=false, apagando=false;

const P = () => dados[modo];
const LISTA = () => CONJ[modo];
const gCel = document.getElementById("celulas");
const gNum = document.getElementById("numeros");
const svg  = document.getElementById("grade");
const fita = document.getElementById("fita");

function chave(l,c){ return l+","+c }
function corDe(cod){ const v=LISTA().find(v=>v.cod===cod); return v?v.cor:null }

function desenhar(){
  const p = LADO/N;
  gCel.innerHTML=""; gNum.innerHTML="";
  for(let l=1;l<=N;l++){
    for(let c=1;c<=N;c++){
      const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x",(X0+(c-1)*p).toFixed(2));
      r.setAttribute("y",(Y0+(l-1)*p).toFixed(2));
      r.setAttribute("width",p.toFixed(2));
      r.setAttribute("height",p.toFixed(2));
      r.setAttribute("class","cel");
      r.dataset.l=l; r.dataset.c=c;
      gCel.appendChild(r);
    }
  }
  const fs = N>13 ? 2.6 : 3.1;
  for(let c=1;c<=N;c++){
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",(X0+(c-.5)*p).toFixed(2));
    t.setAttribute("y","7.4");
    t.setAttribute("text-anchor","middle");
    t.setAttribute("class","num"); t.style.fontSize=fs+"px";
    t.textContent=c; gNum.appendChild(t);
  }
  for(let l=1;l<=N;l++){
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x","7.2");
    t.setAttribute("y",(Y0+(l-.5)*p).toFixed(2));
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","central");
    t.setAttribute("class","num"); t.style.fontSize=fs+"px";
    t.textContent=l; gNum.appendChild(t);
  }
  pintar();
}

function pintar(){
  const so = document.getElementById("soCamada").checked;
  const atual = P();
  gCel.querySelectorAll("rect").forEach(r=>{
    const cod = atual[chave(r.dataset.l,r.dataset.c)];
    const mostrar = cod && (!so || cod===foco);
    r.setAttribute("fill", mostrar ? corDe(cod) : "transparent");
    r.setAttribute("fill-opacity", mostrar ? "1" : "0");
    r.style.pointerEvents="all";
  });
  gerar();
}

function aplicar(el){
  if(!el || !el.dataset.l) return;
  const k = chave(el.dataset.l, el.dataset.c);
  if(apagando || lapis===0) delete P()[k];
  else P()[k]=lapis;
  pintar();
}

svg.addEventListener("pointerdown",e=>{
  const alvo=e.target.closest("rect.cel"); if(!alvo) return;
  e.preventDefault();
  pintando=true;
  apagando = (lapis!==0 && P()[chave(alvo.dataset.l,alvo.dataset.c)]===lapis);
  aplicar(alvo);
});
svg.addEventListener("pointermove",e=>{
  if(!pintando) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el && el.classList.contains("cel")) aplicar(el);
});
window.addEventListener("pointerup",()=>{pintando=false;apagando=false});

function linhas(cod){
  const atual=P(), out=[];
  for(let l=1;l<=N;l++){
    const linha=[];
    for(let c=1;c<=N;c++) linha.push(atual[chave(l,c)]===cod?1:0);
    out.push(linha);
  }
  return out;
}

function gerar(){
  const v=LISTA().find(v=>v.cod===foco) || LISTA()[0];
  const M=linhas(v.cod);
  const total=M.flat().reduce((a,b)=>a+b,0);
  let txt="";

  if(nivel==="coord"){
    const pares=[];
    M.forEach((linha,i)=>linha.forEach((val,j)=>{ if(val) pares.push("("+(i+1)+", "+(j+1)+")") }));
    txt = pares.length ? pares.join("  ") : "";
  }
  else if(nivel==="linha"){
    txt = total ? M.map((linha,i)=>"Linha "+(i+1)+":  "+linha.join(" ")).join("\n") : "";
  }
  else {
    const partes=[];
    M.forEach((linha,i)=>{
      const blocos=[]; let a=linha[0], n=1;
      for(let k=1;k<linha.length;k++){
        if(linha[k]===a) n++;
        else { blocos.push(n+(a?" cheios":" vazios")); a=linha[k]; n=1 }
      }
      blocos.push(n+(a?" cheios":" vazios"));
      partes.push("Linha "+(i+1)+":  "+blocos.join(", "));
    });
    txt = total ? partes.join("\n") : "";
  }

  document.getElementById("saida").textContent = txt;
  document.getElementById("tituloPainel").textContent = "Código: " + v.nome;
  document.getElementById("dica").textContent = DICAS[nivel];
  document.getElementById("conta").textContent = total
    ? total + (total===1 ? " quadradinho pintado" : " quadradinhos pintados")
    : "";
}

function montarFita(){
  fita.innerHTML="";
  LISTA().forEach(v=>{
    const b=document.createElement("button");
    b.className="lapis"; b.setAttribute("aria-pressed", v.cod===lapis);
    b.innerHTML='<span class="pastilha" style="background:'+v.cor+'"></span>'+v.nome+' <span class="codigo-num">'+v.cod+'</span>';
    b.onclick=()=>{
      lapis=v.cod; foco=v.cod;
      fita.querySelectorAll(".lapis").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      pintar();
    };
    fita.appendChild(b);
  });
  const borracha=document.createElement("button");
  borracha.className="lapis"; borracha.setAttribute("aria-pressed", lapis===0);
  borracha.innerHTML='<span class="pastilha" style="background:#fff"></span>Borracha <span class="codigo-num">0</span>';
  borracha.onclick=()=>{
    lapis=0;
    fita.querySelectorAll(".lapis").forEach(x=>x.setAttribute("aria-pressed","false"));
    borracha.setAttribute("aria-pressed","true");
  };
  fita.appendChild(borracha);
}

document.querySelectorAll(".modo").forEach(m=>{
  m.onclick=()=>{
    modo=m.dataset.modo; lapis=1; foco=1;
    document.querySelectorAll(".modo").forEach(x=>x.setAttribute("aria-pressed","false"));
    m.setAttribute("aria-pressed","true");
    montarFita(); pintar();
  };
});

document.querySelectorAll(".aba").forEach(a=>{
  a.onclick=()=>{
    nivel=a.dataset.nivel;
    document.querySelectorAll(".aba").forEach(x=>x.setAttribute("aria-selected","false"));
    a.setAttribute("aria-selected","true");
    gerar();
  };
});

document.getElementById("tamanho").onchange=e=>{ N=+e.target.value; dados={biomas:{},regioes:{}}; desenhar() };
document.getElementById("soCamada").onchange=pintar;
document.getElementById("limpar").onclick=()=>{ dados[modo]={}; pintar() };
document.getElementById("imprimir").onclick=()=>window.print();
document.getElementById("copiar").onclick=async e=>{
  const t=document.getElementById("saida").textContent;
  if(!t){ e.target.textContent="Nada para copiar ainda"; setTimeout(()=>e.target.textContent="Copiar código",1800); return }
  try{ await navigator.clipboard.writeText(t); e.target.textContent="Copiado"; }
  catch{ e.target.textContent="Não deu para copiar"; }
  setTimeout(()=>e.target.textContent="Copiar código",1800);
};

montarFita();
desenhar();
</script>
</body>
</html>
